server {
    listen 80;
    server_name localhost;

    # Maksymalny rozmiar wgrywanych plików (np. zdjęcia potraw)
    client_max_body_size 25M;

    # 1. Frontend Web (React SPA) - brak cache dla index.html, aby natychmiast wykrywać nowe wersje
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Statyczne wersjonowane asety Vite (posiadają hash w nazwie)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pobieranie aplikacji Android (.APK)
    location ~* \.apk$ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, no-transform";
    }

    # 2. Pliki statyczne Django (Admin / Swagger)
    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Pliki medialne (zdjęcia potraw, avatar itp.)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Zapytania API Django Ninja oraz Panel Admina
    location ~ ^/(api|admin) {
        proxy_pass http://adonis_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 5. WebSockets (Czat w czasie rzeczywistym)
    location /ws/ {
        proxy_pass http://adonis_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
