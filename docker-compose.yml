services:
  db:
    image: postgres:16-alpine
    container_name: adonis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-adonis_db}
      POSTGRES_USER: ${DB_USER:-adonis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adonis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adonis_user} -d ${DB_NAME:-adonis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adonis_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adonis_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_recipes &&
             daphne -b 0.0.0.0 -p 8000 adonis_backend.asgi:application"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-adonis-super-secret-key-change-in-production-2026}
      - ALLOWED_HOSTS=*
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-adonis_db}
      - DB_USER=${DB_USER:-adonis_user}
      - DB_PASSWORD=${DB_PASSWORD:-adonis_password}
      - DB_HOST=db
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-adonis-jwt-secret-key-ultra-secure-auth-2026}
    volumes:
      - ./media:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adonis_net
      - siec_web

volumes:
  postgres_data:
    driver: local

networks:
  adonis_net:
    driver: bridge
  siec_web:
    external: true
